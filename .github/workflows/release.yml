name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # ── macOS (requires Xcode 26 for Liquid Glass) ─────────────────────
  build-macos:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          echo "Before cleanup:"
          df -h /
          # Remove unneeded Xcode platforms and simulators
          sudo python3 -c 'import shutil, sys; [shutil.rmtree(path, ignore_errors=True) for path in sys.argv[1:]]' \
            /Applications/Xcode_16.4.app \
            "$HOME/Library/Developer/CoreSimulator" \
            /Library/Developer/CoreSimulator
          # Remove large homebrew caches
          brew cleanup -s 2>/dev/null || true
          echo "After cleanup:"
          df -h /

      - name: Install FFmpeg
        run: brew install ffmpeg

      # Signing & notarization are OPTIONAL. If the DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64
      # secret is set, the DMG is signed with that Developer ID identity (and notarized when
      # APPLE_ID / APPLE_TEAM_ID / APPLE_APP_SPECIFIC_PASSWORD are also set). Otherwise the
      # build falls back to an ad-hoc signed DMG suitable for personal / source builds.
      - name: Import Developer ID certificate (optional)
        id: import_cert
        env:
          DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64:-}" ]; then
            echo "No Developer ID certificate secret configured — building unsigned DMG."
            exit 0
          fi
          if [ -z "${DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64 set but DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD is missing"
            exit 1
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/cropaway-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$DEVELOPER_ID_APPLICATION_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_APPLICATION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in imported certificate"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi

          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build DMG
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CODE_SIGN_IDENTITY: ${{ env.CODE_SIGN_IDENTITY }}
        run: ./scripts/build-dmg.sh ${{ steps.version.outputs.VERSION }}

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/Cropaway-${{ steps.version.outputs.VERSION }}.dmg
          if-no-files-found: error

      - name: Delete signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" 2>/dev/null || true
          fi

  # ── Windows ────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          Write-Host "Version: $ver"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
        shell: pwsh

      - name: Download FFmpeg
        working-directory: CropawayWindows
        shell: pwsh
        run: |
          $FFmpegDir = "ffmpeg-bin"
          New-Item -ItemType Directory -Path $FFmpegDir -Force | Out-Null

          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          $zip = "ffmpeg-download.zip"

          Write-Host "Downloading FFmpeg..."
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing

          Write-Host "Extracting..."
          $extractDir = "ffmpeg-extract"
          Expand-Archive -Path $zip -DestinationPath $extractDir

          $binDir = Get-ChildItem -Path $extractDir -Recurse -Directory -Filter "bin" | Select-Object -First 1
          if ($binDir) {
              Copy-Item (Join-Path $binDir.FullName "ffmpeg.exe") (Join-Path $FFmpegDir "ffmpeg.exe")
              Copy-Item (Join-Path $binDir.FullName "ffprobe.exe") (Join-Path $FFmpegDir "ffprobe.exe")
              Write-Host "FFmpeg ready."
          } else {
              Write-Error "Could not find FFmpeg binaries."
              exit 1
          }

          Remove-Item -Force $zip -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue

      - name: Build application
        working-directory: CropawayWindows
        shell: pwsh
        run: |
          dotnet publish CropawayWindows/CropawayWindows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -o publish

      - name: Bundle FFmpeg
        working-directory: CropawayWindows
        shell: pwsh
        run: |
          $dest = "publish/ffmpeg"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item "ffmpeg-bin/ffmpeg.exe" "$dest/ffmpeg.exe" -Force
          Copy-Item "ffmpeg-bin/ffprobe.exe" "$dest/ffprobe.exe" -Force
          Write-Host "FFmpeg bundled into publish/ffmpeg/"

      - name: Create installer
        working-directory: CropawayWindows
        shell: pwsh
        run: |
          $inno = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $inno)) {
              $inno = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $inno) {
              Write-Error "Inno Setup not found"
              exit 1
          }

          New-Item -ItemType Directory -Path output -Force | Out-Null
          & $inno "/DMyAppVersion=${{ steps.version.outputs.VERSION }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

          Write-Host "Installer created:"
          Get-ChildItem output/

      - name: Create portable ZIP
        working-directory: CropawayWindows
        shell: pwsh
        run: |
          Compress-Archive -Path "publish\*" -DestinationPath "output\Cropaway-Windows-Portable-${{ steps.version.outputs.VERSION }}.zip"
          Write-Host "Portable ZIP created"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: CropawayWindows/output/CropawaySetup-*.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: CropawayWindows/output/Cropaway-Windows-Portable-*.zip
          if-no-files-found: error

  # ── Publish unified release ────────────────────────────────────────
  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Cropaway ${{ steps.version.outputs.VERSION }}
          body: |
            ## Cropaway ${{ steps.version.outputs.VERSION }}

            ### macOS
            | File | Description |
            |------|-------------|
            | `Cropaway-${{ steps.version.outputs.VERSION }}.dmg` | macOS app (drag to Applications) |

            **Requirements:** macOS 13 Ventura or later. FFmpeg is bundled.

            ### Windows
            | File | Description |
            |------|-------------|
            | `CropawaySetup-${{ steps.version.outputs.VERSION }}.exe` | Windows installer with Start Menu shortcuts |
            | `Cropaway-Windows-Portable-${{ steps.version.outputs.VERSION }}.zip` | Portable build, no install needed |

            **Requirements:** Windows 10 or later (64-bit). FFmpeg is bundled.
          files: |
            artifacts/macos-dmg/Cropaway-${{ steps.version.outputs.VERSION }}.dmg
            artifacts/windows-installer/CropawaySetup-${{ steps.version.outputs.VERSION }}.exe
            artifacts/windows-portable/Cropaway-Windows-Portable-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
